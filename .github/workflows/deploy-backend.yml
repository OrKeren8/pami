name: Deploy Backend Services

on:
  push:
    branches: [main]

jobs:
  deploy-projects-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Projects Service Image
        run: |
          cd projects_service
          # Generate a unique tag based on commit SHA
          IMAGE_TAG=${{ github.sha }}
          docker build -t pami-projects-service:$IMAGE_TAG .
          docker tag pami-projects-service:$IMAGE_TAG 909189231170.dkr.ecr.us-east-1.amazonaws.com/pami/projects-service:$IMAGE_TAG
          docker tag pami-projects-service:$IMAGE_TAG 909189231170.dkr.ecr.us-east-1.amazonaws.com/pami/projects-service:latest
          docker push 909189231170.dkr.ecr.us-east-1.amazonaws.com/pami/projects-service:$IMAGE_TAG
          docker push 909189231170.dkr.ecr.us-east-1.amazonaws.com/pami/projects-service:latest

      - name: Register Projects Service Task Definition
        run: |
          cat > task-def.json << EOF
          {
            "family": "pami-projects-service",
            "networkMode": "awsvpc",
            "requiresCompatibilities": ["FARGATE"],
            "cpu": "512",
            "memory": "1024",
            "executionRoleArn": "arn:aws:iam::909189231170:role/LabRole",
            "taskRoleArn": "arn:aws:iam::909189231170:role/LabRole",
            "containerDefinitions": [
              {
                "name": "pami-projects-service",
                "image": "909189231170.dkr.ecr.us-east-1.amazonaws.com/pami/projects-service:latest",
                "portMappings": [
                  {
                    "containerPort": 8000,
                    "protocol": "tcp",
                    "appProtocol": "http"
                  }
                ],
                "essential": true,
                "environment": [
                  {
                    "name": "MONGODB_URL",
                    "value": "${{ secrets.MONGODB_URL }}"
                  },
                  {
                    "name": "AI_SERVICE_URL",
                    "value": "http://pami-alb-550898099.us-east-1.elb.amazonaws.com/ai"
                  }
                ],
                "logConfiguration": {
                  "logDriver": "awslogs",
                  "options": {
                    "awslogs-group": "/ecs/pami-projects-service",
                    "awslogs-create-group": "true",
                    "awslogs-region": "us-east-1",
                    "awslogs-stream-prefix": "ecs"
                  }
                }
              }
            ]
          }
          EOF
          
          aws ecs register-task-definition --cli-input-json file://task-def.json

      - name: Create or Update Projects Service
        run: |
          # Check if service exists
          if aws ecs describe-services --cluster pami-cluster --services pami-projects-service --region us-east-1 | grep -q "ACTIVE\|DRAINING"; then
            echo "Service exists, updating..."
            aws ecs update-service \
              --cluster pami-cluster \
              --service pami-projects-service \
              --task-definition pami-projects-service \
              --force-new-deployment \
              --desired-count 1 \
              --region us-east-1
          else
            echo "Service doesn't exist, creating..."
            aws ecs create-service \
              --cluster pami-cluster \
              --service-name pami-projects-service \
              --task-definition pami-projects-service \
              --desired-count 1 \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[subnet-047bd3bcf439f9667,subnet-0617c57f1370ef445],securityGroups=[sg-0a6ab09920fd49e29],assignPublicIp=ENABLED}" \
              --load-balancers "targetGroupArn=arn:aws:elasticloadbalancing:us-east-1:909189231170:targetgroup/projects-service-tg/5342c6b6e7418012,containerName=pami-projects-service,containerPort=8000" \
              --region us-east-1
          fi
          # Ensure desired count is 1 in case the service existed with 0
          aws ecs update-service --cluster pami-cluster --service pami-projects-service --desired-count 1 --region us-east-1 || true

      - name: Wait for Projects Service deployment
        run: |
          # Wait for the service to stabilize
          aws ecs wait services-stable \
            --cluster pami-cluster \
            --services pami-projects-service \
            --region us-east-1

  deploy-ai-conversation-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push AI Conversation Service Image
        run: |
          cd ai_conversation_service
          # Generate a unique tag based on commit SHA
          IMAGE_TAG=${{ github.sha }}
          docker build -t pami-ai-conversation-service:$IMAGE_TAG .
          docker tag pami-ai-conversation-service:$IMAGE_TAG 909189231170.dkr.ecr.us-east-1.amazonaws.com/pami/ai-conversation-service:$IMAGE_TAG
          docker tag pami-ai-conversation-service:$IMAGE_TAG 909189231170.dkr.ecr.us-east-1.amazonaws.com/pami/ai-conversation-service:latest
          docker push 909189231170.dkr.ecr.us-east-1.amazonaws.com/pami/ai-conversation-service:$IMAGE_TAG
          docker push 909189231170.dkr.ecr.us-east-1.amazonaws.com/pami/ai-conversation-service:latest

      - name: Register AI Conversation Service Task Definition
        run: |
          cat > task-def.json << EOF
          {
            "family": "pami-ai-conversation-service",
            "networkMode": "awsvpc",
            "requiresCompatibilities": ["FARGATE"],
            "cpu": "512",
            "memory": "1024",
            "executionRoleArn": "arn:aws:iam::909189231170:role/LabRole",
            "taskRoleArn": "arn:aws:iam::909189231170:role/LabRole",
            "containerDefinitions": [
              {
                "name": "ai-conversation-service",
                "image": "909189231170.dkr.ecr.us-east-1.amazonaws.com/pami/ai-conversation-service:latest",
                "portMappings": [
                  {
                    "containerPort": 8001,
                    "protocol": "tcp",
                    "appProtocol": "http"
                  }
                ],
                "essential": true,
                "environment": [
                  {
                    "name": "MONGODB_URL",
                    "value": "${{ secrets.MONGODB_URL }}"
                  },
                  {
                    "name": "OPENAI_API_KEY",
                    "value": "${{ secrets.OPENAI_API_KEY }}"
                  }
                ],
                "logConfiguration": {
                  "logDriver": "awslogs",
                  "options": {
                    "awslogs-group": "/ecs/pami-ai-conversation-service",
                    "awslogs-create-group": "true",
                    "awslogs-region": "us-east-1",
                    "awslogs-stream-prefix": "ecs"
                  }
                }
              }
            ]
          }
          EOF
          
          aws ecs register-task-definition --cli-input-json file://task-def.json

      - name: Create or Update AI Conversation Service
        run: |
          # Check if service exists
          if aws ecs describe-services --cluster pami-cluster --services pami-ai-conversation-service --region us-east-1 | grep -q "ACTIVE\|DRAINING"; then
            echo "Service exists, updating..."
            aws ecs update-service \
              --cluster pami-cluster \
              --service pami-ai-conversation-service \
              --task-definition pami-ai-conversation-service \
              --force-new-deployment \
              --region us-east-1
          else
            echo "Service doesn't exist, creating..."
            aws ecs create-service \
              --cluster pami-cluster \
              --service-name pami-ai-conversation-service \
              --task-definition pami-ai-conversation-service \
              --desired-count 1 \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[subnet-047bd3bcf439f9667,subnet-0617c57f1370ef445],securityGroups=[sg-0a6ab09920fd49e29],assignPublicIp=ENABLED}" \
              --load-balancers "targetGroupArn=arn:aws:elasticloadbalancing:us-east-1:909189231170:targetgroup/ai-conversation-service-tg/890f1b53a5f3b1f8,containerName=ai-conversation-service,containerPort=8001" \
              --region us-east-1
          fi

      - name: Wait for AI Conversation Service deployment
        run: |
          # Wait for the service to stabilize
          aws ecs wait services-stable \
            --cluster pami-cluster \
            --services pami-ai-conversation-service \
            --region us-east-1

      - name: Get AI Conversation Service status
        run: |
          echo "AI Conversation Service deployment completed successfully!"
          aws ecs describe-services \
            --cluster pami-cluster \
            --services pami-ai-conversation-service \
            --region us-east-1 \
            --query 'services[0].taskDefinition' \
            --output text