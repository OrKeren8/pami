name: Deploy Projects Service

on:
  push:
    branches: [main]
    paths:
      - 'projects_service/**' # Only runs when projects service code changes

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Image
        run: |
          cd projects_service
          docker build -t pami-projects-service .
          docker tag pami-projects-service:latest 669954808028.dkr.ecr.us-east-1.amazonaws.com/pami/projects-service:latest
          docker push 669954808028.dkr.ecr.us-east-1.amazonaws.com/pami/projects-service:latest

      - name: Deploy to ECS Express
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: pami-projects-service
          image: 669954808028.dkr.ecr.us-east-1.amazonaws.com/pami/projects-service:latest
          cluster: pami-cluster