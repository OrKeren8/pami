name: Deploy Projects Service

on:
  push:
    branches: [main]
    paths:
      - 'projects_service/**' # Only runs when projects service code changes

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Image
        run: |
          cd projects_service
          # Generate a unique tag based on commit SHA
          IMAGE_TAG=${{ github.sha }}
          docker build -t pami-projects-service:$IMAGE_TAG .
          docker tag pami-projects-service:$IMAGE_TAG 669954808028.dkr.ecr.us-east-1.amazonaws.com/pami/projects-service:$IMAGE_TAG
          docker tag pami-projects-service:$IMAGE_TAG 669954808028.dkr.ecr.us-east-1.amazonaws.com/pami/projects-service:latest
          docker push 669954808028.dkr.ecr.us-east-1.amazonaws.com/pami/projects-service:$IMAGE_TAG
          docker push 669954808028.dkr.ecr.us-east-1.amazonaws.com/pami/projects-service:latest

      - name: Update ECS Service
        run: |
          # Update the service to use the new image
          aws ecs update-service \
            --cluster pami-cluster \
            --service pami-projects-service \
            --force-new-deployment \
            --region us-east-1

      - name: Wait for deployment to complete
        run: |
          # Wait for the service to stabilize
          aws ecs wait services-stable \
            --cluster pami-cluster \
            --services pami-projects-service \
            --region us-east-1

      - name: Get service status
        run: |
          echo "Deployment completed successfully!"
          aws ecs describe-services \
            --cluster pami-cluster \
            --services pami-projects-service \
            --region us-east-1 \
            --query 'services[0].taskDefinition' \
            --output text