name: Deploy Backend Services

on:
  push:
    branches: [main]

jobs:
  deploy-projects-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Projects Service Image
        run: |
          cd projects_service
          # Generate a unique tag based on commit SHA
          IMAGE_TAG=${{ github.sha }}
          docker build -t pami-projects-service:$IMAGE_TAG .
          docker tag pami-projects-service:$IMAGE_TAG 669954808028.dkr.ecr.us-east-1.amazonaws.com/pami/projects-service:$IMAGE_TAG
          docker tag pami-projects-service:$IMAGE_TAG 669954808028.dkr.ecr.us-east-1.amazonaws.com/pami/projects-service:latest
          docker push 669954808028.dkr.ecr.us-east-1.amazonaws.com/pami/projects-service:$IMAGE_TAG
          docker push 669954808028.dkr.ecr.us-east-1.amazonaws.com/pami/projects-service:latest

      - name: Register Projects Service Task Definition
        run: |
          cat > task-def.json << EOF
          {
            "family": "pami-projects-service",
            "networkMode": "awsvpc",
            "requiresCompatibilities": ["FARGATE"],
            "cpu": "512",
            "memory": "1024",
            "executionRoleArn": "arn:aws:iam::669954808028:role/LabRole",
            "taskRoleArn": "arn:aws:iam::669954808028:role/LabRole",
            "containerDefinitions": [
              {
                "name": "projects-service",
                "image": "669954808028.dkr.ecr.us-east-1.amazonaws.com/pami/projects-service:latest",
                "portMappings": [
                  {
                    "containerPort": 8000,
                    "protocol": "tcp",
                    "appProtocol": "http"
                  }
                ],
                "essential": true,
                "environment": [
                  {
                    "name": "MONGODB_URL",
                    "value": "${{ secrets.MONGODB_URL }}"
                  }
                ],
                "logConfiguration": {
                  "logDriver": "awslogs",
                  "options": {
                    "awslogs-group": "/ecs/pami-projects-service",
                    "awslogs-create-group": "true",
                    "awslogs-region": "us-east-1",
                    "awslogs-stream-prefix": "ecs"
                  }
                }
              }
            ]
          }
          EOF
          
          aws ecs register-task-definition --cli-input-json file://task-def.json

      - name: Update Projects Service ECS
        run: |
          # Update the service to use the new task definition
          aws ecs update-service \
            --cluster pami-cluster \
            --service pami-projects-service \
            --task-definition pami-projects-service \
            --force-new-deployment \
            --region us-east-1

      - name: Wait for Projects Service deployment
        run: |
          # Wait for the service to stabilize
          aws ecs wait services-stable \
            --cluster pami-cluster \
            --services pami-projects-service \
            --region us-east-1

  deploy-ai-conversation-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push AI Conversation Service Image
        run: |
          cd ai_conversation_service
          # Generate a unique tag based on commit SHA
          IMAGE_TAG=${{ github.sha }}
          docker build -t pami-ai-conversation-service:$IMAGE_TAG .
          docker tag pami-ai-conversation-service:$IMAGE_TAG 669954808028.dkr.ecr.us-east-1.amazonaws.com/pami/ai-conversation-service:$IMAGE_TAG
          docker tag pami-ai-conversation-service:$IMAGE_TAG 669954808028.dkr.ecr.us-east-1.amazonaws.com/pami/ai-conversation-service:latest
          docker push 669954808028.dkr.ecr.us-east-1.amazonaws.com/pami/ai-conversation-service:$IMAGE_TAG
          docker push 669954808028.dkr.ecr.us-east-1.amazonaws.com/pami/ai-conversation-service:latest

      - name: Register AI Conversation Service Task Definition
        run: |
          cat > task-def.json << EOF
          {
            "family": "pami-ai-conversation-service",
            "networkMode": "awsvpc",
            "requiresCompatibilities": ["FARGATE"],
            "cpu": "512",
            "memory": "1024",
            "executionRoleArn": "arn:aws:iam::669954808028:role/LabRole",
            "taskRoleArn": "arn:aws:iam::669954808028:role/LabRole",
            "containerDefinitions": [
              {
                "name": "ai-conversation-service",
                "image": "669954808028.dkr.ecr.us-east-1.amazonaws.com/pami/ai-conversation-service:latest",
                "portMappings": [
                  {
                    "containerPort": 8001,
                    "protocol": "tcp",
                    "appProtocol": "http"
                  }
                ],
                "essential": true,
                "environment": [
                  {
                    "name": "MONGODB_URL",
                    "value": "${{ secrets.MONGODB_URL }}"
                  },
                  {
                    "name": "OPENAI_API_KEY",
                    "value": "${{ secrets.OPENAI_API_KEY }}"
                  }
                ],
                "logConfiguration": {
                  "logDriver": "awslogs",
                  "options": {
                    "awslogs-group": "/ecs/pami-ai-conversation-service",
                    "awslogs-create-group": "true",
                    "awslogs-region": "us-east-1",
                    "awslogs-stream-prefix": "ecs"
                  }
                }
              }
            ]
          }
          EOF
          
          aws ecs register-task-definition --cli-input-json file://task-def.json

      - name: Update AI Conversation Service ECS
        run: |
          # Update the service to use the new task definition
          aws ecs update-service \
            --cluster pami-cluster \
            --service pami-ai-conversation-service \
            --task-definition pami-ai-conversation-service \
            --force-new-deployment \
            --region us-east-1

      - name: Wait for AI Conversation Service deployment
        run: |
          # Wait for the service to stabilize
          aws ecs wait services-stable \
            --cluster pami-cluster \
            --services pami-ai-conversation-service \
            --region us-east-1

      - name: Get AI Conversation Service status
        run: |
          echo "AI Conversation Service deployment completed successfully!"
          aws ecs describe-services \
            --cluster pami-cluster \
            --services pami-ai-conversation-service \
            --region us-east-1 \
            --query 'services[0].taskDefinition' \
            --output text