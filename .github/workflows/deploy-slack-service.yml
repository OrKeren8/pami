name: Deploy Slack Service

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'slack_service/**'
      - '.github/workflows/deploy-slack-service.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Image
        run: |
          cd slack_service

          IMAGE_TAG=${{ github.sha }}

          docker build -t pami-slack-service:$IMAGE_TAG .
          docker tag pami-slack-service:$IMAGE_TAG 413410781221.dkr.ecr.us-east-1.amazonaws.com/pami/slack-service:$IMAGE_TAG
          docker tag pami-slack-service:$IMAGE_TAG 413410781221.dkr.ecr.us-east-1.amazonaws.com/pami/slack-service:latest

          docker push 413410781221.dkr.ecr.us-east-1.amazonaws.com/pami/slack-service:$IMAGE_TAG
          docker push 413410781221.dkr.ecr.us-east-1.amazonaws.com/pami/slack-service:latest

      - name: Register Task Definition
        run: |
          cat > task-def.json << 'EOF'
          {
            "family": "pami-slack-service",
            "networkMode": "awsvpc",
            "requiresCompatibilities": ["FARGATE"],
            "cpu": "512",
            "memory": "1024",
            "executionRoleArn": "arn:aws:iam::413410781221:role/LabRole",
            "taskRoleArn": "arn:aws:iam::413410781221:role/LabRole",
            "containerDefinitions": [
              {
                "name": "slack-service",
                "image": "413410781221.dkr.ecr.us-east-1.amazonaws.com/pami/slack-service:latest",
                "portMappings": [
                  {
                    "containerPort": 8002,
                    "protocol": "tcp",
                    "appProtocol": "http"
                  }
                ],
                "essential": true,
                "environment": [
                  {
                    "name": "MONGODB_URL",
                    "value": "${{ secrets.MONGODB_URL }}"
                  },
                  {
                    "name": "SLACK_BOT_TOKEN",
                    "value": "${{ secrets.SLACK_BOT_TOKEN }}"
                  },
                  {
                    "name": "SLACK_SIGNING_SECRET",
                    "value": "${{ secrets.SLACK_SIGNING_SECRET }}"
                  }
                ],
                "logConfiguration": {
                  "logDriver": "awslogs",
                  "options": {
                    "awslogs-group": "/ecs/pami-slack-service",
                    "awslogs-create-group": "true",
                    "awslogs-region": "us-east-1",
                    "awslogs-stream-prefix": "ecs"
                  }
                }
              }
            ]
          }
          EOF

          aws ecs register-task-definition --cli-input-json file://task-def.json

      - name: Create or Update ECS Service
        run: |
          # Looked up by name, not hardcoded: AWS appends a random id to every target group
          # ARN, so a rebuilt lab account recreates slack-service-tg under a new ARN and any
          # hardcoded one becomes a dead reference that fails CreateService.
          TG_ARN=$(aws elbv2 describe-target-groups \
            --names slack-service-tg \
            --query 'TargetGroups[0].TargetGroupArn' \
            --output text \
            --region us-east-1)

          if [ -z "$TG_ARN" ] || [ "$TG_ARN" = "None" ]; then
            echo "::error::Target group slack-service-tg not found. Run setup_aws_infrastructure.py first."
            exit 1
          fi
          echo "Using target group $TG_ARN"

          VPC_ID=$(aws ec2 describe-vpcs \
            --filters Name=is-default,Values=true \
            --query 'Vpcs[0].VpcId' --output text --region us-east-1)
          SUBNETS=$(aws ec2 describe-subnets \
            --filters Name=vpc-id,Values=$VPC_ID \
            --query 'Subnets[].SubnetId' --output text --region us-east-1 | tr '\t' ',')
          SG_ID=$(aws ec2 describe-security-groups \
            --filters Name=group-name,Values=pami-ecs-services-sg Name=vpc-id,Values=$VPC_ID \
            --query 'SecurityGroups[0].GroupId' --output text --region us-east-1)

          if [ -z "$SUBNETS" ] || [ "$SG_ID" = "None" ]; then
            echo "::error::Could not resolve VPC networking. Run setup_aws_infrastructure.py first."
            exit 1
          fi
          echo "Using subnets $SUBNETS and security group $SG_ID"

          # Check if service exists
          if aws ecs describe-services --cluster pami-cluster --services pami-slack-service --region us-east-1 | grep -q "ACTIVE\|DRAINING"; then
            echo "Service exists, updating..."
            aws ecs update-service \
              --cluster pami-cluster \
              --service pami-slack-service \
              --task-definition pami-slack-service \
              --force-new-deployment \
              --desired-count 1 \
              --region us-east-1
          else
            echo "Service doesn't exist, creating..."
            aws ecs create-service \
              --cluster pami-cluster \
              --service-name pami-slack-service \
              --task-definition pami-slack-service \
              --desired-count 1 \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG_ID],assignPublicIp=ENABLED}" \
              --load-balancers "targetGroupArn=$TG_ARN,containerName=slack-service,containerPort=8002" \
              --region us-east-1
          fi
          # Ensure desired count is 1 in case the service existed with 0
          aws ecs update-service --cluster pami-cluster --service pami-slack-service --desired-count 1 --region us-east-1 || true

      - name: Wait for deployment to complete
        run: |
          aws ecs wait services-stable \
            --cluster pami-cluster \
            --services pami-slack-service \
            --region us-east-1

      - name: Get service status
        run: |
          echo "Deployment completed successfully!"
          aws ecs describe-services \
            --cluster pami-cluster \
            --services pami-slack-service \
            --region us-east-1 \
            --query 'services[0].taskDefinition' \
            --output text