name: Deploy Slack Service

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'slack_service/**'
      - '.github/workflows/deploy-slack-service.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Image
        run: |
          cd slack_service

          IMAGE_TAG=${{ github.sha }}

          docker build -t pami-slack-service:$IMAGE_TAG .
          docker tag pami-slack-service:$IMAGE_TAG 374850831945.dkr.ecr.us-east-1.amazonaws.com/pami/slack-service:$IMAGE_TAG
          docker tag pami-slack-service:$IMAGE_TAG 374850831945.dkr.ecr.us-east-1.amazonaws.com/pami/slack-service:latest

          docker push 374850831945.dkr.ecr.us-east-1.amazonaws.com/pami/slack-service:$IMAGE_TAG
          docker push 374850831945.dkr.ecr.us-east-1.amazonaws.com/pami/slack-service:latest

      - name: Update ECS Service
        run: |
          aws ecs update-service \
            --cluster pami-cluster \
            --service pami-slack-service \
            --force-new-deployment \
            --region us-east-1

      - name: Wait for deployment to complete
        run: |
          aws ecs wait services-stable \
            --cluster pami-cluster \
            --services pami-slack-service \
            --region us-east-1

      - name: Get service status
        run: |
          echo "Deployment completed successfully!"
          aws ecs describe-services \
            --cluster pami-cluster \
            --services pami-slack-service \
            --region us-east-1 \
            --query 'services[0].taskDefinition' \
            --output text