name: Diagnose Jira Connection

# Manual-only diagnostic: asks Atlassian, with the same token the jira-service uses, who the
# token is and which projects it can see - including trashed and archived ones, which the
# service's own listing never shows. Exists because "connected but zero projects" cannot be
# told apart from "project deleted" or "access revoked" from outside.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Who is this token, and what can it see
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USERNAME: ${{ secrets.JIRA_USERNAME }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          # Trimmed: a trailing newline or slash in a pasted secret breaks the URL, and the
          # error that produces is indistinguishable from a dead connection.
          BASE=$(printf '%s' "$JIRA_BASE_URL" | tr -d '[:space:]' | sed 's:/*$::')
          USER=$(printf '%s' "$JIRA_USERNAME" | tr -d '[:space:]')
          TOKEN=$(printf '%s' "$JIRA_API_TOKEN" | tr -d '[:space:]')
          ask() {
            code=$(curl -s -m 20 -o /tmp/body -w '%{http_code}' -u "$USER:$TOKEN" -H "Accept: application/json" "$BASE$1")
            echo "[$code] $1"
            head -c 500 /tmp/body; echo
          }
          echo "host: $(echo "$BASE" | sed 's#https\?://##')"
          ask "/rest/api/3/myself"
          ask "/rest/api/3/project/search?status=live"
          ask "/rest/api/3/project/search?status=deleted"
          ask "/rest/api/3/project/search?status=archived"
