name: Run AWS Infrastructure Setup

# Manual-only: this provisions/reconciles shared AWS resources (VPC networking, ECS
# cluster, ECR repos, ALB, target groups, Cognito, Amplify), so it must never run from a
# push - a run picks the moment, not a commit.
on:
  workflow_dispatch:

jobs:
  run-infra-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r infrastructure-requirements.txt

      - name: Run AWS infrastructure setup
        env:
          AWS_REGION: us-east-1
        run: python setup_aws_infrastructure.py
